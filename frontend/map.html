<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ЭкоГомель — Карта пунктов приёма</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    /* ==================== 1. ПЕРЕМЕННЫЕ (тёмная тема по умолчанию) ==================== */
    :root {
      --bg-dark: #0d1210;
      --bg-card: #141c18;
      --bg-card-hover: #1b2621;
      --bg-input: #0a0e0c;

      --accent-green: #206746;
      --accent-green-hover: #298259;
      --accent-light: #25d366;

      --text-main: #e2e8f0;
      --text-muted: #8c9ba5;
      --border-color: #23302a;

      --tag-bg: rgba(255, 255, 255, 0.05);
      --shadow-marker: rgba(37, 211, 102, 0.6);
      --logo-color: #fff;

      --radius-sm: 8px;
      --radius-md: 14px;
    }

    /* Светлая тема */
    [data-theme="light"] {
      --bg-dark: #f4f7f6;
      --bg-card: #ffffff;
      --bg-card-hover: #f0fdf4;
      --bg-input: #ffffff;

      --accent-green: #206746;
      --accent-green-hover: #298259;
      --accent-light: #16a34a;

      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;

      --tag-bg: rgba(0, 0, 0, 0.05);
      --shadow-marker: rgba(22, 163, 74, 0.5);
      --logo-color: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
      width: 100%;
    }

    /* ==================== 2. ШАПКА ==================== */
    .header {
      border-bottom: 1px solid var(--border-color);
      background-color: var(--bg-dark);
      position: sticky;
      top: 0;
      z-index: 100;
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    .header__container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 70px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--logo-color);
      font-weight: 700;
      font-size: 1.2rem;
      transition: color 0.3s ease;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .nav__link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.95rem;
      transition: color 0.2s;
    }

    .nav__link:hover,
    .nav__link.active {
      color: var(--text-main);
      border-bottom: 2px solid var(--accent-light);
      padding-bottom: 4px;
    }

    /* Кнопка переключения темы */
    .theme-toggle {
      background: transparent;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 6px 10px;
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-main);
      transition: background-color 0.2s, border-color 0.2s, transform 0.2s;
    }

    .theme-toggle:hover {
      background-color: var(--bg-card-hover);
      transform: scale(1.05);
    }
    
    .theme-toggle img {
      width: 20px;
      height: 20px;
      object-fit: contain;
      display: block;
      pointer-events: none;
    }

    /* ==================== 3. КАРТА ==================== */
    .main-layout {
      display: flex;
      flex: 1;
      height: calc(100vh - 70px);
      overflow: hidden;
    }

    #sidebar {
      width: 360px;
      background-color: var(--bg-card);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      z-index: 10;
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    .search-box {
      padding: 14px;
      border-bottom: 1px solid var(--border-color);
      transition: border-color 0.3s ease;
    }

    .search-box input {
      width: 100%;
      padding: 10px 12px;
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s, background-color 0.3s ease, color 0.3s ease;
    }

    .search-box input:focus {
      border-color: var(--accent-light);
    }

    .filters {
      padding: 12px 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      border-bottom: 1px solid var(--border-color);
      transition: border-color 0.3s ease;
    }

    .filters button {
      padding: 6px 12px;
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      color: var(--text-muted);
      font-size: 0.8rem;
      cursor: pointer;
      transition: 0.2s;
    }

    .filters button:hover {
      border-color: var(--accent-light);
      color: var(--text-main);
    }

    .filters button.active {
      background-color: var(--accent-green);
      color: #fff;
      border-color: var(--accent-green);
    }

    .actions {
      padding: 10px 14px;
      display: flex;
      gap: 8px;
      border-bottom: 1px solid var(--border-color);
      transition: border-color 0.3s ease;
    }

    .actions button {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      transition: 0.2s;
    }

    #addModeBtn {
      background-color: var(--accent-green);
      color: #fff;
    }

    #addModeBtn:hover {
      background-color: var(--accent-green-hover);
    }

    #addModeBtn.active {
      background-color: #d97706;
      color: #fff;
    }

    #clearAllBtn {
      background-color: #dc2626;
      color: #fff;
    }

    #clearAllBtn:hover {
      opacity: 0.9;
    }

    #points-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    .point-card {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border-color);
      cursor: pointer;
      transition: background-color 0.15s, border-color 0.3s ease;
    }

    .point-card:hover {
      background-color: var(--bg-card-hover);
    }

    .point-card.active {
      background-color: var(--bg-card-hover);
      border-left: 4px solid var(--accent-light);
    }

    .point-name {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .point-address {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .point-hours {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .point-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 8px;
    }

    .point-tags span {
      padding: 2px 6px;
      background-color: var(--tag-bg);
      color: var(--accent-light);
      border-radius: 4px;
      font-size: 0.7rem;
    }

    /* Карта */
    #map {
      flex: 1;
      height: 100%;
      background-color: var(--bg-dark);
      transition: background-color 0.3s ease;
    }

    /* Popup Leaflet */
    .leaflet-popup-content-wrapper {
      background-color: var(--bg-card);
      color: var(--text-main);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
      transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
    }

    .leaflet-popup-tip {
      background-color: var(--bg-card);
      transition: background-color 0.3s ease;
    }

    .leaflet-popup-close-button {
      color: var(--text-muted) !important;
    }

    .popup-title {
      font-size: 0.95rem;
      font-weight: bold;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .popup-address {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .popup-hours {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .popup-desc {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 6px;
      line-height: 1.4;
    }

    .popup-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 6px;
    }

    .popup-tags span {
      padding: 2px 6px;
      background-color: var(--tag-bg);
      color: var(--accent-light);
      border-radius: 3px;
      font-size: 0.7rem;
    }

    .popup-delete {
      margin-top: 8px;
      padding: 4px 10px;
      background-color: #dc2626;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.7rem;
    }

    /* Кастомный маркер */
    .custom-marker {
      width: 18px;
      height: 18px;
      background-color: var(--accent-light);
      border: 2px solid var(--bg-card);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--shadow-marker);
      cursor: pointer;
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    /* ==================== 4. ТЁМНЫЙ ВИД ТАЙЛОВ ==================== */
    [data-theme="dark"] .leaflet-tile-pane {
      filter: invert(1) hue-rotate(180deg) brightness(0.95) contrast(0.9);
    }

    /* ==================== 5. МОДАЛЬНОЕ ОКНО ==================== */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.6);
      display: none; justify-content: center; align-items: center;
      z-index: 1000; backdrop-filter: blur(4px);
    }
    .modal-overlay.active { display: flex; }
    .modal-window {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      animation: modalFadeIn 0.2s ease-out;
    }
    @keyframes modalFadeIn { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-title { font-size: 1.2rem; font-weight: 600; margin-bottom: 16px; color: var(--text-main); }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px; }
    .form-group input { width: 100%; padding: 10px; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: var(--radius-sm); color: var(--text-main); outline: none; font-family: inherit; }
    .form-group input:focus { border-color: var(--accent-light); }
    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
    .modal-actions button { flex: 1; padding: 10px; border-radius: var(--radius-sm); font-weight: 600; cursor: pointer; border: none; transition: 0.2s; }
    .btn-cancel { background: var(--bg-card-hover); color: var(--text-main); border: 1px solid var(--border-color); }
    .btn-cancel:hover { background: var(--border-color); }
    .btn-save { background: var(--accent-green); color: #fff; }
    .btn-save:hover { background: var(--accent-green-hover); }

    /* ==================== 6. МОБИЛЬНАЯ ВЕРСИЯ ==================== */
    @media (max-width: 800px) {
      .main-layout {
        flex-direction: column;
        height: auto;
        overflow-y: auto;
      }
      #sidebar {
        width: 100%;
        height: 45vh;
        border-right: none;
        border-bottom: 1px solid var(--border-color);
      }
      #map {
        height: 55vh;
        width: 100%;
      }
      .nav {
        gap: 12px;
      }
      .nav__link {
        font-size: 0.85rem;
      }
      .header__container {
        height: 60px;
      }
    }
  </style>
</head>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- ============ ПЕРЕКЛЮЧАТЕЛЬ ТЕМЫ ============ -->
  <script>
    (function () {
      const btn = document.getElementById('theme-toggle');
      const saved = localStorage.getItem('theme') || 'dark';

      if (saved === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
        btn.innerHTML = '<img src="sun.png" alt="Светлая тема" style="width:20px; height:20px; pointer-events:none;">';
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        btn.innerHTML = '<img src="moon.png" alt="Тёмная тема" style="width:20px; height:20px; pointer-events:none;">';
      }

      btn.addEventListener('click', () => {
        const cur = document.documentElement.getAttribute('data-theme');
        if (cur === 'light') {
          document.documentElement.setAttribute('data-theme', 'dark');
          localStorage.setItem('theme', 'dark');
          btn.innerHTML = '<img src="moon.png" alt="Тёмная тема" style="width:20px; height:20px; pointer-events:none;">';
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
          localStorage.setItem('theme', 'light');
          btn.innerHTML = '<img src="sun.png" alt="Светлая тема" style="width:20px; height:20px; pointer-events:none;">';
        }
      });
    })();
  </script>

      { id: 12, name: "ООО «БелВторОтходы»", address: "г. Гомель, ул. Борисенко, 7/2", latitude: 52.4045, longitude: 30.9061, accepted_types: ["Электроника", "Бытовая техника", "Батарейки"], working_hours: "Пн-Пт 08:30-17:00", description: "Пункт сбора отработанного электронного оборудования." },
      { id: 13, name: "Приемный пункт стеклотары и макулатуры", address: "г. Гомель, ул. Кожара, 42", latitude: 52.4542, longitude: 31.0028, accepted_types: ["Стеклотара", "Стеклобой", "Макулатура"], working_hours: "Пн-Пт 09:00-16:30, Сб 09:00-14:00", description: "Пункт шаговой доступности в Железнодорожном районе." },
      { id: 14, name: "Эко-контейнер в «Евроопт» (Хатаевича)", address: "г. Гомель, ул. Хатаевича, 9", latitude: 52.4431, longitude: 31.0165, accepted_types: ["Батарейки", "Ртутные лампы"], working_hours: "Пн-Вс 09:00-23:00", description: "Специальный эко-контейнер для элементов питания и ламп." },
      { id: 15, name: "Эко-контейнер в «Евроопт» (Ефремова)", address: "г. Гомель, ул. Ефремова, 11-1", latitude: 52.4618, longitude: 30.9658, accepted_types: ["Батарейки", "Ртутные лампы"], working_hours: "Пн-Вс 09:00-22:00", description: "Контейнер для сбора люминесцентных ламп и батареек." },
      { id: 16, name: "Эко-контейнер в ТЦ «Евроопт» (Владимирова)", address: "г. Гомель, ул. Владимирова, 16", latitude: 52.4211, longitude: 30.9329, accepted_types: ["Батарейки", "Ртутные лампы"], working_hours: "Пн-Вс 09:00-22:00", description: "Эко-бокс для мелких опасных отходов." },
      { id: 17, name: "Эко-контейнер в «Евроопт» (Свиридова)", address: "г. Гомель, ул. Свиридова, 15-1", latitude: 52.4746, longitude: 31.0255, accepted_types: ["Батарейки", "Ртутные лампы"], working_hours: "Пн-Вс 09:00-22:00", description: "Пункт сбора батареек и ламп в Клёнковском." },
      { id: 18, name: "Эко-контейнер в ТЦ «МАНДАРИН ПЛАЗА»", address: "г. Гомель, Речицкий проспект, 5В", latitude: 52.4056, longitude: 30.9381, accepted_types: ["Батарейки", "Ртутные лампы"], working_hours: "Пн-Вс 10:00-21:00", description: "Эко-контейнер для ртутьсодержащих ламп и батареек." }
    ];

    /* ============================================================
       2. КОНФИГУРАЦИЯ
       ============================================================ */
    const DATA_SOURCE = 'local';
    const API_URL = 'http://localhost:8000/api/v1/points';
    const LS_KEY = 'ecogomel_points';

    /* ============================================================
       3. РАБОТА С ДАННЫМИ
       ============================================================ */
    async function getPoints() {
      if (DATA_SOURCE === 'api') {
        try {
          const res = await fetch(API_URL);
          return await res.json();
        } catch (e) {
          console.error('Ошибка API:', e);
          return JSON.parse(JSON.stringify(INITIAL_POINTS));
        }
      }
      const saved = localStorage.getItem(LS_KEY);
      if (saved) return JSON.parse(saved);
      return JSON.parse(JSON.stringify(INITIAL_POINTS));
    }

    function savePointsLocal(list) {
      if (DATA_SOURCE === 'local') {
        localStorage.setItem(LS_KEY, JSON.stringify(list));
      }
    }

    async function apiAddPoint(point) {
      if (DATA_SOURCE === 'api') {
        try {
          const res = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(point)
          });
          return await res.json();
        } catch (e) {
          console.error('Ошибка API:', e);
        }
      }
      point.id = Date.now();
      return point;
    }

    async function apiDeletePoint(id) {
      if (DATA_SOURCE === 'api') {
        try {
          await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
        } catch (e) {
          console.error('Ошибка API:', e);
        }
      }
    }

    /* ============================================================
       4. СОСТОЯНИЕ
       ============================================================ */
    let points = [];
    const markerMap = {};
    let activeFilter = 'all';
    let searchText = '';
    let addMode = false;
    let tempLatLng = null;

    /* ============================================================
       5. КАРТА
       ============================================================ */
    const map = L.map('map', { zoomControl: false })
      .setView([52.4345, 30.9754], 12);

    L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
      maxZoom: 19,
      subdomains: 'abc',
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    L.control.zoom({ position: 'topright' }).addTo(map);

    const greenIcon = L.divIcon({
      className: '',
      html: '<div class="custom-marker"></div>',
      iconSize: [18, 18],
      iconAnchor: [9, 9],
      popupAnchor: [0, -10]
    });

    /* ============================================================
       6. МАРКЕРЫ И ФИЛЬТРАЦИЯ
       ============================================================ */
    function addMarker(p) {
      const marker = L.marker([p.latitude, p.longitude], { icon: greenIcon }).addTo(map);
      marker.bindPopup(buildPopup(p));
      marker.on('click', () => highlightCard(p.id));
      markerMap[p.id] = marker;
    }

    function buildPopup(p) {
      const tags = (p.accepted_types || [])
        .map(t => `<span>${t}</span>`).join('');

      return `
      <div style="min-width:220px">
        <div class="popup-title">${p.name}</div>
        <div class="popup-address">${p.address}</div>
        <div class="popup-tags">${tags}</div>
        <div class="popup-hours">${p.working_hours}</div>
        <div class="popup-desc">${p.description || ''}</div>
        <button class="popup-delete" onclick="deletePoint(${p.id})">
          Удалить точку
        </button>
      </div>`;
    }

    function syncMarkers() {
      points.forEach(p => {
        const matchType = activeFilter === 'all' ||
          (p.accepted_types || []).some(t => t.toLowerCase().includes(activeFilter.toLowerCase()));
        
        const matchText = searchText === '' ||
          p.name.toLowerCase().includes(searchText) ||
          p.address.toLowerCase().includes(searchText);

        const marker = markerMap[p.id];
        if (marker) {
          if (matchType && matchText) {
            if (!map.hasLayer(marker)) map.addLayer(marker);
          } else {
            if (map.hasLayer(marker)) map.removeLayer(marker);
          }
        }
      });
    }

    /* ============================================================
       7. СПИСОК ТОЧЕК
       ============================================================ */
    const listEl = document.getElementById('points-list');

    function renderList() {
      const filtered = points.filter(p => {
        const matchType = activeFilter === 'all' ||
          (p.accepted_types || []).some(t =>
            t.toLowerCase().includes(activeFilter.toLowerCase()));

        const matchText = searchText === '' ||
          p.name.toLowerCase().includes(searchText) ||
          p.address.toLowerCase().includes(searchText);

        return matchType && matchText;
      });

      listEl.innerHTML = '';

      if (filtered.length === 0) {
        listEl.innerHTML =
          '<div style="padding:20px;color:var(--text-muted);text-align:center">' +
          'Ничего не найдено</div>';
        return;
      }

      filtered.forEach(p => {
        const card = document.createElement('div');
        card.className = 'point-card';
        card.dataset.id = p.id;

        const tags = (p.accepted_types || []).slice(0, 4)
          .map(t => `<span>${t}</span>`).join('');

        card.innerHTML = `
        <div class="point-name">${p.name}</div>
        <div class="point-address">${p.address}</div>
        <div class="point-tags">${tags}</div>
        <div class="point-hours">${p.working_hours}</div>`;

        card.addEventListener('click', () => {
          map.setView([p.latitude, p.longitude], 15);
          markerMap[p.id].openPopup();
          highlightCard(p.id);
        });

        listEl.appendChild(card);
      });
    }

    function highlightCard(id) {
      document.querySelectorAll('.point-card')
        .forEach(c => c.classList.remove('active'));

      const card = document.querySelector(`.point-card[data-id="${id}"]`);
      if (card) {
        card.classList.add('active');
        card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    /* ============================================================
       8. МОДАЛЬНОЕ ОКНО (ДОБАВЛЕНИЕ)
       ============================================================ */
    const addModal = document.getElementById('addModal');
    const addModeBtn = document.getElementById('addModeBtn');

    addModeBtn.addEventListener('click', function () {
      addMode = !addMode;
      this.classList.toggle('active', addMode);
      this.textContent = addMode ? '📍 Кликните на карту' : '➕ Добавить точку';
    });

    map.on('click', function (e) {
      if (!addMode) return;
      tempLatLng = e.latlng;
      addModal.classList.add('active');
      
      document.getElementById('m_name').value = '';
      document.getElementById('m_address').value = '';
      document.getElementById('m_types').value = '';
      document.getElementById('m_hours').value = '';
    });

    document.getElementById('btnCancelModal').addEventListener('click', () => {
      addModal.classList.remove('active');
      addMode = false;
      addModeBtn.classList.remove('active');
      addModeBtn.textContent = '➕ Добавить точку';
    });

    document.getElementById('btnSaveModal').addEventListener('click', async () => {
      const name = document.getElementById('m_name').value.trim();
      if (!name) { alert('Введите название!'); return; }

      const newPoint = {
        name: name,
        address: document.getElementById('m_address').value.trim() || '—',
        latitude: tempLatLng.lat,
        longitude: tempLatLng.lng,
        accepted_types: document.getElementById('m_types').value.split(',').map(s => s.trim()).filter(Boolean),
        working_hours: document.getElementById('m_hours').value.trim() || '—',
        description: ''
      };

      const saved = await apiAddPoint(newPoint);
      points.push(saved);
      savePointsLocal(points);
      
      addMarker(saved);
      syncMarkers();
      renderList();

      addModal.classList.remove('active');
      addMode = false;
      addModeBtn.classList.remove('active');
      addModeBtn.textContent = '➕ Добавить точку';
    });

    /* ============================================================
       9. УДАЛЕНИЕ ТОЧКИ
       ============================================================ */
    async function deletePoint(id) {
      if (!confirm('Удалить эту точку?')) return;

      if (markerMap[id]) {
        map.removeLayer(markerMap[id]);
        delete markerMap[id];
      }

      await apiDeletePoint(id);

      points = points.filter(p => p.id !== id);
      savePointsLocal(points);
      renderList();
      syncMarkers();
    }

    window.deletePoint = deletePoint;

    document.getElementById('clearAllBtn').addEventListener('click', async function () {
      if (!confirm('Удалить ВСЕ точки с карты?')) return;

      for (const p of points) await apiDeletePoint(p.id);

      Object.values(markerMap).forEach(m => map.removeLayer(m));
      Object.keys(markerMap).forEach(k => delete markerMap[k]);

      points = [];
      savePointsLocal(points);
      renderList();
    });

    /* ============================================================
       10. ФИЛЬТРЫ И ПОИСК
       ============================================================ */
    document.querySelectorAll('#filtersContainer button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#filtersContainer button')
          .forEach(b => b.classList.remove('active'));

        btn.classList.add('active');
        activeFilter = btn.dataset.filter;
        renderList();
        syncMarkers();
      });
    });

    document.getElementById('searchInput').addEventListener('input', e => {
      searchText = e.target.value.trim().toLowerCase();
      renderList();
      syncMarkers();
    });

    /* ============================================================
       11. ЗАПУСК
       ============================================================ */
    (async function init() {
      points = await getPoints();
      points.forEach(p => addMarker(p));
      renderList();
    })();
  </script>
</body>

</html>
