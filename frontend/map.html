<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ЭкоГомель — Карта пунктов приёма</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    /* ==================== 1. ПЕРЕМЕННЫЕ ==================== */
    :root {
      --bg-dark: #0d1210;
      --bg-card: #141c18;
      --bg-card-hover: #1b2621;
      --bg-input: #0a0e0c;

      --accent-green: #206746;
      --accent-green-hover: #298259;
      --accent-light: #25d366;

      --text-main: #e2e8f0;
      --text-muted: #8c9ba5;
      --border-color: #23302a;

      --tag-bg: rgba(255, 255, 255, 0.05);
      --shadow-marker: rgba(37, 211, 102, 0.6);
      --logo-color: #fff;

      --radius-sm: 8px;
      --radius-md: 14px;
    }

    /* Светлая тема */
    [data-theme="light"] {
      --bg-dark: #f4f7f6;
      --bg-card: #ffffff;
      --bg-card-hover: #f0fdf4;
      --bg-input: #ffffff;

      --accent-green: #206746;
      --accent-green-hover: #298259;
      --accent-light: #16a34a;

      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;

      --tag-bg: rgba(0, 0, 0, 0.05);
      --shadow-marker: rgba(22, 163, 74, 0.5);
      --logo-color: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
      width: 100%;
    }

    /* ==================== 2. ШАПКА ==================== */
    .header {
      border-bottom: 1px solid var(--border-color);
      background-color: var(--bg-dark);
      position: sticky;
      top: 0;
      z-index: 100;
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    .header__container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 70px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text-main);
      font-weight: 700;
      font-size: 1.2rem;
      white-space: nowrap;
    }
    
    .logo__icon img {
      width: 52px;
      height: 52px;
      object-fit: contain;
      display: block;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 24px;
      white-space: nowrap;
    }

    .nav__link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.95rem;
      transition: color 0.2s;
    }

    .nav__link:hover, .nav__link.active {
      color: var(--text-main);
      border-bottom: 2px solid var(--accent-light);
      padding-bottom: 4px;
    }

    .theme-toggle {
      background: transparent;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 6px 10px;
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-main);
      transition: background-color 0.2s, border-color 0.2s, transform 0.2s;
    }

    .theme-toggle:hover {
      background-color: var(--bg-card-hover);
      transform: scale(1.05);
    }
    
    .theme-toggle img {
      width: 20px; height: 20px; object-fit: contain; display: block; pointer-events: none;
    }

    /* Бургер-меню (идентично style.css) */
    .burger {
      display: none;
      flex-direction: column;
      justify-content: space-between;
      width: 24px;
      height: 18px;
      background: transparent;
      border: none;
      cursor: pointer;
      z-index: 1001;
      padding: 0;
    }
    .burger span {
      width: 100%;
      height: 2px;
      background-color: var(--text-main);
      transition: all 0.3s ease;
      border-radius: 2px;
    }
    .burger.is-active span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
    .burger.is-active span:nth-child(2) { opacity: 0; }
    .burger.is-active span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }

    /* Блокировка скролла страницы при открытом мобильном меню */
    body.menu-open { overflow: hidden; }

    /* ==================== 3. ДЕСКТОПНАЯ ВЕРСИЯ ==================== */
    .main-layout {
      display: flex;
      flex: 1;
      height: calc(100vh - 70px);
      overflow: hidden;
      position: relative;
    }

    #sidebar {
      width: 360px;
      background-color: var(--bg-card);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      z-index: 10;
    }

    .sidebar-top {
      display: flex;
      flex-direction: column;
    }

    .search-box {
      padding: 14px;
      border-bottom: 1px solid var(--border-color);
    }

    .search-box input {
      width: 100%;
      padding: 10px 12px;
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
    }

    .filters-wrapper {
      position: relative;
      border-bottom: 1px solid var(--border-color);
    }

    .filters {
      padding: 12px 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .filters button {
      padding: 6px 12px;
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      color: var(--text-muted);
      font-size: 0.8rem;
      cursor: pointer;
      transition: 0.2s;
      white-space: nowrap;
    }

    .filters button:hover { border-color: var(--accent-light); color: var(--text-main); }
    .filters button.active { background-color: var(--accent-green); color: #fff; border-color: var(--accent-green); }

    .actions {
      padding: 10px 14px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      border-bottom: 1px solid var(--border-color);
    }

    .actions button {
      width: 100%;
      padding: 10px 4px;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      transition: 0.2s;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }

    #addModeBtn { background-color: var(--accent-green); color: #fff; }
    #addModeBtn:hover { background-color: var(--accent-green-hover); }
    #addModeBtn.active { background-color: #d97706; }
    #clearAllBtn { background-color: #dc2626; color: #fff; }
    #clearAllBtn:hover { opacity: 0.9; }
    #geoBtn { background-color: #2563eb; color: #fff; }
    #geoBtn:hover { background-color: #1d4ed8; }
    #geoBtn.loading { opacity: 0.6; }
    #nearestBtn { background-color: #8b5cf6; color: #fff; }
    #nearestBtn:hover { background-color: #7c3aed; }
    #nearestBtn.active { background-color: #f59e0b; }

    #points-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    .point-card {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border-color);
      cursor: pointer;
      transition: background-color 0.15s;
    }

    .point-card:hover { background-color: var(--bg-card-hover); }
    .point-card.active { background-color: var(--bg-card-hover); border-left: 4px solid var(--accent-light); }

    .point-name { font-size: 0.95rem; font-weight: 600; margin-bottom: 4px; }
    .point-address { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px; }
    .point-hours { font-size: 0.75rem; color: var(--text-muted); }
    .point-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
    .point-tags span { padding: 2px 6px; background-color: var(--tag-bg); color: var(--accent-light); border-radius: 4px; font-size: 0.7rem; }

    #map {
      flex: 1;
      height: 100%;
      background-color: var(--bg-dark);
    }

    /* ==================== 4. POPUP, МАРКЕРЫ ==================== */
    .leaflet-popup-content-wrapper { background-color: var(--bg-card); color: var(--text-main); border-radius: var(--radius-sm); border: 1px solid var(--border-color); }
    .leaflet-popup-tip { background-color: var(--bg-card); }
    .leaflet-popup-close-button { color: var(--text-muted) !important; }
    .popup-title { font-size: 0.95rem; font-weight: bold; margin-bottom: 4px; }
    .popup-address { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px; }
    .popup-hours { font-size: 0.75rem; color: var(--text-muted); }
    .popup-desc { font-size: 0.75rem; color: var(--text-muted); margin-top: 6px; }
    .popup-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
    .popup-tags span { padding: 2px 6px; background-color: var(--tag-bg); color: var(--accent-light); border-radius: 3px; font-size: 0.7rem; }
    .popup-delete { margin-top: 8px; padding: 4px 10px; background-color: #dc2626; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 0.7rem; width: 100%; transition: background 0.2s; }
    .popup-delete:hover { background-color: #b91c1c; }

    .custom-marker { width: 18px; height: 18px; background-color: var(--accent-light); border: 2px solid var(--bg-card); border-radius: 50%; box-shadow: 0 0 8px var(--shadow-marker); cursor: pointer; }
    [data-theme="dark"] .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(0.95) contrast(0.9); }

    .leaflet-control-attribution { background: rgba(255, 255, 255, 0.6) !important; color: #1e293b !important; font-weight: 600; font-size: 0.75rem; padding: 4px 10px !important; border-radius: 8px 0 0 0; backdrop-filter: blur(4px); border: 1px solid rgba(0, 0, 0, 0.1); border-right: none; border-bottom: none; }
    [data-theme="dark"] .leaflet-control-attribution { background: rgba(20, 28, 24, 0.7) !important; color: #e2e8f0 !important; border-color: rgba(255, 255, 255, 0.1); }

    /* ==================== 5. МОДАЛЬНОЕ ОКНО ==================== */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(4px); }
    .modal-overlay.active { display: flex; }
    .modal-window { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 24px; width: 100%; max-width: 420px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .modal-title { font-size: 1.2rem; font-weight: 600; margin-bottom: 16px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px; }
    .form-group input { width: 100%; padding: 10px; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: var(--radius-sm); color: var(--text-main); outline: none; }
    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
    .modal-actions button { flex: 1; padding: 10px; border-radius: var(--radius-sm); font-weight: 600; cursor: pointer; border: none; }
    .btn-cancel { background: var(--bg-card-hover); color: var(--text-main); border: 1px solid var(--border-color); }
    .btn-save { background: var(--accent-green); color: #fff; }

    /* ==================== 6. ГЕОЛОКАЦИЯ ==================== */
    .user-marker { width: 18px; height: 18px; background-color: #2563eb; border: 3px solid #fff; border-radius: 50%; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.35), 0 2px 6px rgba(0,0,0,0.3); position: relative; }
    .user-marker::after { content: ''; position: absolute; top: 50%; left: 50%; width: 18px; height: 18px; border-radius: 50%; background: rgba(37, 99, 235, 0.5); transform: translate(-50%, -50%); animation: userPulse 2s ease-out infinite; }
    @keyframes userPulse { 0% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; } 100% { transform: translate(-50%, -50%) scale(2.8); opacity: 0; } }
    .point-distance { display: inline-block; margin-top: 4px; font-size: 0.72rem; color: #3b82f6; font-weight: 600; }

    /* ==================== 7. СОСТОЯНИЯ ЗАГРУЗКИ / ОШИБКИ ==================== */
    .state-container { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; text-align: center; color: var(--text-muted); }
    .spinner { width: 30px; height: 30px; border: 3px solid var(--border-color); border-top-color: var(--accent-light); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-text { color: #ef4444; margin-bottom: 12px; font-weight: 600; }
    .btn-retry { background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-main); padding: 8px 16px; border-radius: var(--radius-sm); cursor: pointer; transition: 0.2s; }
    .btn-retry:hover { background-color: var(--bg-card-hover); }

    #toggleListBtn { display: none; width: 100%; padding: 12px; background-color: var(--bg-card-hover); border: none; border-bottom: 1px solid var(--border-color); color: var(--text-main); font-weight: 600; cursor: pointer; text-align: center; font-size: 0.9rem; transition: background-color 0.2s; }
    #toggleListBtn:hover { background-color: var(--border-color); }

    /* MVP: админские элементы скрыты до релиза админки. */
    [data-admin-only] { display: none !important; }

    /* ==================== 8. МОБИЛЬНАЯ ВЕРСИЯ ==================== */
    @media (max-width: 800px) {
      .main-layout { position: relative; display: block; }
      #map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
      
      /* ФИКС: Обертка выпускает список поверх карты */
      #sidebar { 
        position: absolute; top: 0; left: 0; width: 100%; 
        pointer-events: none; z-index: 1000; 
      }

      .sidebar-top { 
        pointer-events: auto; background: var(--bg-card); 
        border-radius: 0 0 16px 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); 
        position: relative; z-index: 2;
      }

      .search-box { padding: 10px 14px; }
      
      .filters { padding: 10px 14px; flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; }
      .filters::-webkit-scrollbar { display: none; }
      
      .filters-wrapper::before, .filters-wrapper::after {
        content: ''; position: absolute; top: 0; bottom: 0; width: 45px; pointer-events: none; z-index: 2; transition: opacity 0.3s ease; opacity: 0;
      }
      .filters-wrapper::before { left: 0; background: linear-gradient(to right, rgba(100, 116, 139, 0.3) 0%, transparent 100%); }
      .filters-wrapper::after { right: 0; background: linear-gradient(to left, rgba(100, 116, 139, 0.3) 0%, transparent 100%); }
      .filters-wrapper.show-left::before { opacity: 1; }
      .filters-wrapper.show-right::after { opacity: 1; }

      .actions { padding: 10px 14px; gap: 8px; }
      .actions button { padding: 10px 8px; font-size: 0.8rem; }

      #toggleListBtn { display: block; }

      /* ФИКС: Список выпадает поверх карты */
      #points-list {
        pointer-events: auto;
        position: absolute;
        top: 100%; /* Появляется прямо под шапкой фильтров */
        left: 0;
        width: 100%;
        background: var(--bg-card);
        max-height: 0;
        opacity: 0;
        overflow: hidden;
        transition: max-height 0.3s ease-in-out, opacity 0.3s ease;
        border-radius: 0 0 16px 16px;
        z-index: 1;
      }
      
      #points-list.open {
        max-height: 60vh; /* Ограничение высоты, чтобы карта была видна снизу */
        opacity: 1;
        overflow-y: auto;
        padding: 8px 0;
        box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        border-radius: 0;
      }
      
      .point-card { padding: 14px 18px; }
    }

    /* ==================== 9. БУРГЕР-МЕНЮ И ШАПКА (как в style.css) ==================== */
    @media (max-width: 768px) {
      /* Шапка выше боковой панели (z-index 1000), чтобы меню открывалось поверх */
      .header { z-index: 1100; }
      .burger { display: flex; }
      .nav--collapsible {
        position: fixed;
        top: 70px;
        left: 0;
        width: 100%;
        background-color: var(--bg-card);
        flex-direction: column;
        padding: 20px;
        box-shadow: 0 10px 15px rgba(0,0,0,0.1);
        transform: translateY(-150%);
        transition: transform 0.3s ease;
        z-index: 1000;
        gap: 16px;
        border-bottom: 1px solid var(--border-color);
      }
      .nav--collapsible.is-open { transform: translateY(0); }
      .nav--collapsible .nav__link {
        font-size: 1.1rem;
        width: 100%;
        text-align: center;
        padding: 8px 0;
      }
    }

    @media (max-width: 400px) {
      .header__container { padding: 0 10px; height: 60px; }
      .logo img { width: 36px; height: 36px; }
      .logo__icon img { width: 36px; height: 36px; }
      .logo { font-size: 1rem; }
      .theme-toggle { padding: 4px 8px; }
      .theme-toggle img { width: 16px; height: 16px; }
      .nav--collapsible { top: 60px; }
      .main-layout { height: calc(100vh - 60px); }
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="container header__container">
      <a href="index.html" class="logo">
        <span class="logo__icon"><img src="logo.svg" alt="Логотип"></span>
        <span class="logo__text">ЭкоГомель</span>
      </a>
      
      <button class="burger" id="burger-btn" aria-label="Открыть меню" aria-controls="nav-menu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav class="nav nav--collapsible" id="nav-menu">
        <a href="index.html" class="nav__link">Поиск</a>
        <a href="map.html" class="nav__link active">Карта</a>
        <a href="about_project.html" class="nav__link">О проекте</a>
        <button id="theme-toggle" class="theme-toggle" aria-label="Переключить тему"></button>
      </nav>
    </div>
  </header>

  <div class="main-layout">
    <aside id="sidebar">
      
      <div class="sidebar-top">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Поиск пункта или адреса" />
        </div>

        <div class="filters-wrapper" id="filtersWrapper">
          <div class="filters" id="filtersContainer">
            <button class="active" data-filter="all">Все</button>
            <button data-filter="Пластик">Пластик</button>
            <button data-filter="Стекло">Стекло</button>
            <button data-filter="Макулатура">Макулатура</button>
            <button data-filter="Батарейки">Батарейки</button>
            <button data-filter="Электроника">Электроника</button>
            <button data-filter="Металлолом">Металлолом</button>
          </div>
        </div>

        <div class="actions">
          <button id="geoBtn" title="Моё местоположение">📍 Я здесь</button>
          <button id="nearestBtn" title="Радиус 3 км">🎯 До 3 км</button>
          <!-- MVP: админские действия скрыты до релиза админки. -->
          <button id="addModeBtn" data-admin-only>➕ Добавить</button>
          <button id="clearAllBtn" data-admin-only>🗑 Удалить все</button>
        </div>

        <button id="toggleListBtn">Показать список</button>
      </div>

      <div id="points-list"></div>
    </aside>

    <div id="map"></div>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО ДОБАВЛЕНИЯ ТОЧКИ -->
  <div class="modal-overlay" id="addModal" data-admin-only>
    <div class="modal-window">
      <h3 class="modal-title">Новая точка на карте</h3>
      <div class="form-group">
        <label>Название точки</label>
        <input type="text" id="m_name" placeholder="Например: ЭкоПункт у дома">
      </div>
      <div class="form-group">
        <label>Адрес</label>
        <input type="text" id="m_address" placeholder="ул. Ленина, д. 1">
      </div>
      <div class="form-group">
        <label>Что принимают (через запятую)</label>
        <input type="text" id="m_types" placeholder="Пластик, Стекло">
      </div>
      <div class="form-group">
        <label>Часы работы</label>
        <input type="text" id="m_hours" placeholder="Пн-Пт 09:00-18:00">
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" id="btnCancelModal">Отмена</button>
        <button class="btn-save" id="btnSaveModal">Сохранить</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="api.js"></script>

  <script>
    /* ============ ПЕРЕКЛЮЧАТЕЛЬ ТЕМЫ ============ */
    (function () {
      const btn = document.getElementById('theme-toggle');
      const saved = localStorage.getItem('theme') || 'dark';
      if (saved === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
        btn.innerHTML = '<img src="sun.svg" alt="Светлая тема">';
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        btn.innerHTML = '<img src="moon.svg" alt="Тёмная тема">';
      }
      btn.addEventListener('click', () => {
        const cur = document.documentElement.getAttribute('data-theme');
        if (cur === 'light') {
          document.documentElement.setAttribute('data-theme', 'dark');
          localStorage.setItem('theme', 'dark');
          btn.innerHTML = '<img src="moon.svg" alt="Тёмная тема">';
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
          localStorage.setItem('theme', 'light');
          btn.innerHTML = '<img src="sun.svg" alt="Светлая тема">';
        }
      });
    })();
  </script>

  <script>
    const NEAREST_RADIUS = 3000; 
    const API_POINTS_URL = `${API_BASE_URL}/points/`;

    let points = [];
    const markerMap = {};
    let activeFilter = 'all';
    let searchText = '';
    let addMode = false;
    let tempLatLng = null;
    let userMarker = null, userCircle = null, userLatLng = null;
    let filterByDistance = false, isLocating = false;
    let isDataLoaded = false;

    const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([52.4345, 30.9754], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', { maxZoom: 19, subdomains: 'abc' }).addTo(map);
    L.control.attribution({ position: 'bottomright', prefix: '' }).addAttribution('🌿 EcoGomel').addTo(map);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    const greenIcon = L.divIcon({ className: '', html: '<div class="custom-marker"></div>', iconSize: [18, 18], iconAnchor: [9, 9], popupAnchor: [0, -10] });
    const userIcon = L.divIcon({ className: '', html: '<div class="user-marker"></div>', iconSize: [18, 18], iconAnchor: [9, 9], popupAnchor: [0, -12] });

    async function fetchPointsFromAPI() {
      const listEl = document.getElementById('points-list');
      const toggleListBtn = document.getElementById('toggleListBtn');
      listEl.innerHTML = `<div class="state-container"><div class="spinner"></div><div>Загрузка...</div></div>`;
      toggleListBtn.textContent = 'Загрузка...';
      isDataLoaded = false;

      try {
        const data = await EcoAPI.getPoints();
        points = data.results ? data.results : data; 
        isDataLoaded = true;

        Object.values(markerMap).forEach(m => map.removeLayer(m));
        Object.keys(markerMap).forEach(k => delete markerMap[k]);

        points.forEach(p => addMarker(p));
        renderList();
        syncMarkers();

      } catch (error) {
        listEl.innerHTML = `<div class="state-container"><div class="error-text">Не удалось загрузить данные</div><button class="btn-retry" onclick="fetchPointsFromAPI()">Повторить</button></div>`;
        toggleListBtn.textContent = 'Ошибка';
      }
    }

    async function addPointToAPI(newPoint) {
      try {
        const response = await fetch(API_POINTS_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(newPoint) });
        if (!response.ok) throw new Error();
        const savedPoint = await response.json();
        points.push(savedPoint);
        addMarker(savedPoint);
        renderList(); syncMarkers();
        return true;
      } catch (error) { alert('Ошибка сохранения'); return false; }
    }

    async function deletePointFromAPI(id) {
      try {
        await fetch(`${API_POINTS_URL}${id}/`, { method: 'DELETE' });
        points = points.filter(p => p.id !== id);
        if (markerMap[id]) { map.removeLayer(markerMap[id]); delete markerMap[id]; }
        renderList(); syncMarkers();
      } catch (error) { alert('Ошибка удаления'); }
    }

    window.deletePoint = async function(id) {
      if (!confirm('Удалить точку?')) return;
      await deletePointFromAPI(id);
    };

    function syncMarkers() {
      points.forEach(p => {
        const types = p.accepted_types || [];
        const matchType = activeFilter === 'all' || types.some(t => t.toLowerCase().includes(activeFilter.toLowerCase()));
        const matchText = searchText === '' || p.name.toLowerCase().includes(searchText) || p.address.toLowerCase().includes(searchText);
        const matchDistance = !filterByDistance || (p._distance && p._distance <= NEAREST_RADIUS);

        const marker = markerMap[p.id];
        if (marker) {
          if (matchType && matchText && matchDistance) { if (!map.hasLayer(marker)) map.addLayer(marker); } 
          else { if (map.hasLayer(marker)) map.removeLayer(marker); }
        }
      });
    }

    const listEl = document.getElementById('points-list');
    const toggleListBtn = document.getElementById('toggleListBtn');

    let visibleCount = 0;

    function isMobile() { return window.innerWidth <= 800; }

    // Текст кнопки: «Скрыть список» / «Показать список (N)»
    function updateToggleText() {
      if (!isDataLoaded) return;
      if (listEl.classList.contains('open')) toggleListBtn.textContent = 'Скрыть список';
      else toggleListBtn.textContent = visibleCount ? `Показать список (${visibleCount})` : 'Ничего не найдено';
    }

    function openListOnMobile() {
      if (!isMobile() || listEl.classList.contains('open')) return;
      listEl.classList.add('open');
      updateToggleText();
    }

    function closeListOnMobile() {
      if (!isMobile() || !listEl.classList.contains('open')) return;
      listEl.classList.remove('open');
      updateToggleText();
    }

    // Высота верхней панели, перекрывающей карту на мобильных
    function getTopInset() {
      if (!isMobile()) return 0;
      const top = document.querySelector('.sidebar-top');
      return top ? top.offsetHeight : 0;
    }

    // Автопан попапа не должен уводить его под верхнюю панель
    function updatePopupPadding() {
      const inset = getTopInset();
      Object.values(markerMap).forEach(m => {
        const popup = m.getPopup();
        if (popup) popup.options.autoPanPaddingTopLeft = L.point(10, inset + 10);
      });
    }
    window.addEventListener('resize', updatePopupPadding);

    // На сколько px опустить маркер ниже центра карты (~200px, но с учётом экрана и панели)
    function getMarkerOffsetY() {
      const mapH = map.getSize().y;
      const POPUP_SPACE = 170; // примерная высота попапа со стрелкой
      const needed = getTopInset() + POPUP_SPACE - mapH / 2;
      const maxOffset = mapH / 2 - 56; // маркер не должен уходить за нижний край
      return Math.max(0, Math.min(Math.max(200, needed), maxOffset));
    }

    function formatDistance(meters) { return meters < 1000 ? Math.round(meters) + ' м' : (meters / 1000).toFixed(1) + ' км'; }

    function renderList() {
      if (!isDataLoaded) return;

      let filtered = points.filter(p => {
        const types = p.accepted_types || [];
        const matchType = activeFilter === 'all' || types.some(t => t.toLowerCase().includes(activeFilter.toLowerCase()));
        const matchText = searchText === '' || p.name.toLowerCase().includes(searchText) || p.address.toLowerCase().includes(searchText);
        const matchDistance = !filterByDistance || (p._distance && p._distance <= NEAREST_RADIUS);
        return matchType && matchText && matchDistance;
      });

      if (userLatLng) filtered.sort((a, b) => (a._distance || Infinity) - (b._distance || Infinity));
      else filtered.sort((a, b) => a.name.localeCompare(b.name));

      visibleCount = filtered.length;
      listEl.innerHTML = '';

      if (filtered.length === 0) {
        listEl.innerHTML = `<div class="state-container"><div style="font-size: 2rem;">🔍</div><div>Ничего не найдено</div></div>`;
        updateToggleText();
        return;
      }

      updateToggleText();

      filtered.forEach(p => {
        const card = document.createElement('div');
        card.className = 'point-card';
        card.dataset.id = p.id;
        const tags = (p.accepted_types || []).slice(0, 4).map(t => `<span>${t}</span>`).join('');
        const distanceHtml = (typeof p._distance === 'number') ? `<div class="point-distance">📏 ${formatDistance(p._distance)} от вас</div>` : '';

        card.innerHTML = `
        <div class="point-name">${p.name}</div>
        <div class="point-address">${p.address}</div>
        <div class="point-tags">${tags}</div>
        <div class="point-hours">${p.working_hours}</div>
        ${distanceHtml}`;

        card.addEventListener('click', () => {
          // Сначала закрываем список, затем центрируем карту со смещением вниз
          closeListOnMobile();
          if (markerMap[p.id]) {
            markerMap[p.id].openPopup();

            const targetZoom = 16;
            const latlng = L.latLng(parseFloat(p.latitude), parseFloat(p.longitude));
            const point = map.project(latlng, targetZoom);
            point.y -= getMarkerOffsetY();
            map.setView(map.unproject(point, targetZoom), targetZoom);
          }
          highlightCard(p.id);
        });
        listEl.appendChild(card);
      });
    }

    function addMarker(p) {
      const marker = L.marker([parseFloat(p.latitude), parseFloat(p.longitude)], { icon: greenIcon }).addTo(map);
      marker.bindPopup(buildPopup(p));
      marker.getPopup().options.autoPanPaddingTopLeft = L.point(10, getTopInset() + 10);
      marker.on('click', () => { highlightCard(p.id); closeListOnMobile(); });
      markerMap[p.id] = marker;
    }

    function buildPopup(p) {
      const tags = (p.accepted_types || []).map(t => `<span>${t}</span>`).join('');
      const distLine = (typeof p._distance === 'number') ? `<div style="font-size:0.72rem;color:#3b82f6;font-weight:600;margin-top:6px;">📏 ${formatDistance(p._distance)} от вас</div>` : '';
      return `<div style="min-width:220px"><div class="popup-title">${p.name}</div><div class="popup-address">${p.address}</div><div class="popup-tags">${tags}</div><div class="popup-hours">${p.working_hours}</div>${distLine}<button class="popup-delete" data-admin-only onclick="deletePoint(${p.id})">Удалить точку</button></div>`;
    }

    function highlightCard(id) {
      document.querySelectorAll('.point-card').forEach(c => c.classList.remove('active'));
      const card = document.querySelector(`.point-card[data-id="${id}"]`);
      if (card) card.classList.add('active');
    }

    const addModal = document.getElementById('addModal');
    const addModeBtn = document.getElementById('addModeBtn');

    if (addModeBtn) {
      addModeBtn.addEventListener('click', function () {
        addMode = !addMode;
        this.classList.toggle('active', addMode);
        this.textContent = addMode ? '📍 Кликните на карту' : '➕ Добавить';
      });
    }

    map.on('click', function (e) {
      if (!addMode) return;
      tempLatLng = e.latlng;
      addModal.classList.add('active');
      document.getElementById('m_name').value = '';
      document.getElementById('m_address').value = '';
      document.getElementById('m_types').value = '';
      document.getElementById('m_hours').value = '';
    });

    document.getElementById('btnCancelModal').addEventListener('click', () => {
      addModal.classList.remove('active');
      addMode = false;
      if (addModeBtn) {
        addModeBtn.classList.remove('active');
        addModeBtn.textContent = '➕ Добавить';
      }
    });

    document.getElementById('btnSaveModal').addEventListener('click', async () => {
      const name = document.getElementById('m_name').value.trim();
      if (!name) { alert('Введите название!'); return; }
      const newPoint = { name, address: document.getElementById('m_address').value.trim() || '—', latitude: tempLatLng.lat, longitude: tempLatLng.lng, accepted_types: document.getElementById('m_types').value.split(',').map(s => s.trim()).filter(Boolean), working_hours: document.getElementById('m_hours').value.trim() || '—', description: '' };
      const success = await addPointToAPI(newPoint);
      if (success) {
        addModal.classList.remove('active');
        addMode = false;
        if (addModeBtn) {
          addModeBtn.classList.remove('active');
          addModeBtn.textContent = '➕ Добавить';
        }
      }
    });

    document.getElementById('clearAllBtn').addEventListener('click', async function () {
      if (!confirm('Удалить ВСЕ точки?')) return;
      for (const p of points) await fetch(`${API_POINTS_URL}${p.id}/`, { method: 'DELETE' });
      points = []; Object.values(markerMap).forEach(m => map.removeLayer(m)); Object.keys(markerMap).forEach(k => delete markerMap[k]);
      renderList(); syncMarkers();
    });

    document.querySelectorAll('#filtersContainer button').forEach(btn => {
      btn.addEventListener('click', () => {
        const filter = btn.dataset.filter;
        if (activeFilter === filter && filter !== 'all') {
          activeFilter = 'all';
          document.querySelectorAll('#filtersContainer button').forEach(b => b.classList.remove('active'));
          document.querySelector('#filtersContainer button[data-filter="all"]').classList.add('active');
        } else {
          activeFilter = filter;
          document.querySelectorAll('#filtersContainer button').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
        }
        renderList(); syncMarkers();
      });
    });

    document.getElementById('searchInput').addEventListener('input', e => {
      searchText = e.target.value.trim().toLowerCase();
      renderList(); syncMarkers();
      openListOnMobile();
    });

    document.getElementById('searchInput').addEventListener('focus', () => {
      openListOnMobile();
    });

    toggleListBtn.addEventListener('click', () => {
      listEl.classList.toggle('open');
      updateToggleText();
    });

    const filtersWrapper = document.getElementById('filtersWrapper');
    const filtersContainer = document.getElementById('filtersContainer');
    function updateFilterShadows() {
      if (!filtersContainer || !filtersWrapper) return;
      if (window.innerWidth > 800) { 
        filtersWrapper.classList.remove('show-left', 'show-right'); return; 
      }
      const scrollLeft = filtersContainer.scrollLeft, scrollWidth = filtersContainer.scrollWidth, clientWidth = filtersContainer.clientWidth;
      if (scrollLeft > 0) filtersWrapper.classList.add('show-left'); else filtersWrapper.classList.remove('show-left');
      if (scrollLeft + clientWidth < scrollWidth - 2) filtersWrapper.classList.add('show-right'); else filtersWrapper.classList.remove('show-right');
    }
    filtersContainer.addEventListener('scroll', updateFilterShadows);
    window.addEventListener('resize', updateFilterShadows);
    setTimeout(updateFilterShadows, 200);
    window.addEventListener('load', () => { updateFilterShadows(); updatePopupPadding(); });

    const geoBtn = document.getElementById('geoBtn');
    const nearestBtn = document.getElementById('nearestBtn');

    function requestLocation() {
      if (isLocating || userLatLng) return; 
      isLocating = true;
      geoBtn.classList.add('loading');
      geoBtn.textContent = '⏳ Ищу...';
      map.locate({ watch: true, setView: false, enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 });
    }

    geoBtn.addEventListener('click', () => {
      if (userLatLng) { map.panTo(userLatLng); if (userMarker) userMarker.openPopup(); } 
      else if (!isLocating) { requestLocation(); }
    });

    nearestBtn.addEventListener('click', () => {
      filterByDistance = !filterByDistance;
      nearestBtn.classList.toggle('active', filterByDistance);
      if (filterByDistance && !userLatLng && !isLocating) requestLocation();
      else { renderList(); syncMarkers(); }
    });

    map.on('locationfound', function (e) {
      isLocating = false; geoBtn.classList.remove('loading'); geoBtn.textContent = '📍 Я здесь'; userLatLng = e.latlng;
      map.panTo(e.latlng);
      if (!userMarker) {
        userMarker = L.marker(e.latlng, { icon: userIcon, zIndexOffset: 1000 }).addTo(map);
        userCircle = L.circle(e.latlng, { radius: e.accuracy, color: '#2563eb', fillColor: '#3b82f6', fillOpacity: 0.12, weight: 1 }).addTo(map);
      } else {
        userMarker.setLatLng(e.latlng); userCircle.setLatLng(e.latlng); userCircle.setRadius(e.accuracy);
      }
      points.forEach(p => { p._distance = map.distance(e.latlng, [parseFloat(p.latitude), parseFloat(p.longitude)]); });
      points.forEach(p => { if (markerMap[p.id]) markerMap[p.id].setPopupContent(buildPopup(p)); });
      renderList(); syncMarkers();
    });

    map.on('locationerror', function (e) {
      isLocating = false; geoBtn.classList.remove('loading'); geoBtn.textContent = '📍 Я здесь';
      if (filterByDistance) { filterByDistance = false; nearestBtn.classList.remove('active'); renderList(); syncMarkers(); }
    });

    (function init() { fetchPointsFromAPI(); })();
  </script>

  <!-- СКРИПТ БУРГЕР-МЕНЮ (идентичен index.html) -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const burgerBtn = document.getElementById('burger-btn');
      const navMenu = document.getElementById('nav-menu');
      if (!burgerBtn || !navMenu) return;

      const setOpen = (open) => {
        burgerBtn.classList.toggle('is-active', open);
        navMenu.classList.toggle('is-open', open);
        burgerBtn.setAttribute('aria-expanded', String(open));
        burgerBtn.setAttribute('aria-label', open ? 'Закрыть меню' : 'Открыть меню');
        document.body.classList.toggle('menu-open', open);
      };

      burgerBtn.addEventListener('click', () => {
        setOpen(!navMenu.classList.contains('is-open'));
      });

      navMenu.querySelectorAll('.nav__link').forEach((link) => {
        link.addEventListener('click', () => setOpen(false));
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && navMenu.classList.contains('is-open')) {
          setOpen(false);
          burgerBtn.focus();
        }
      });

      document.addEventListener('click', (event) => {
        if (!navMenu.classList.contains('is-open')) return;
        if (navMenu.contains(event.target) || burgerBtn.contains(event.target)) return;
        setOpen(false);
      });
    });
  </script>
