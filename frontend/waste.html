<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <script>
    // Мгновенная установка темы из localStorage до отрисовки страницы
    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Все категории — ЭкоГомель</title>
  <link rel="stylesheet" href="style.css">
  
  <style>
    /* Стили специально для каталога категорий по макету */
    .breadcrumbs {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 16px;
    }
    .breadcrumbs a {
      color: var(--text-muted);
      text-decoration: none;
    }
    .breadcrumbs a:hover {
      color: var(--text-main);
    }

    .page-title {
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text-main);
    }
    .page-subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 28px;
    }

    /* Поисковая строка */
    .catalog-search {
      display: flex;
      gap: 12px;
      margin-bottom: 30px;
      max-width: 650px;
    }
    .catalog-search__input-wrapper {
      position: relative;
      flex: 1;
    }
    .catalog-search__input-wrapper img {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      opacity: 0.6;
    }
    .catalog-search__input {
      width: 100%;
      padding: 12px 16px 12px 42px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
    }
    .catalog-search__input:focus {
      border-color: var(--accent-light);
    }

    /* Быстрый переход по категориям */
    .quick-categories {
      margin-bottom: 40px;
    }
    .quick-categories__label {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 12px;
      display: block;
    }
    .quick-categories__list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .quick-cat-btn {
      padding: 8px 16px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      color: var(--text-main);
      font-size: 0.88rem;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .quick-cat-btn:hover, .quick-cat-btn.active {
      background-color: var(--bg-card-hover);
      border-color: var(--accent-light);
    }

    /* Сетка категорий (3 в ряд) */
    .categories-section-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 24px;
    }
    .categories-section-header h2 {
      font-size: 1.5rem;
      font-weight: 600;
    }
    .categories-section-header span {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .category-blocks-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 50px;
    }

    @media (max-width: 992px) {
      .category-blocks-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    @media (max-width: 640px) {
      .category-blocks-grid {
        grid-template-columns: 1fr;
      }
    }

    .cat-block {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 24px;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s;
    }
    .cat-block:hover {
      border-color: var(--accent-light);
    }

    .cat-block__header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }
    .cat-block__icon-box {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background-color: rgba(37, 211, 102, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .cat-block__icon-box img {
      width: 22px;
      height: 22px;
      object-fit: contain;
    }
    .cat-block__title {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 2px;
    }
    .cat-block__desc {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    /* Список предметов внутри блока категории */
    .cat-items-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .cat-item-link {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.9rem;
      transition: background-color 0.15s;
    }
    .cat-item-link:hover {
      background-color: var(--bg-card-hover);
      color: var(--accent-light);
    }
    .cat-item-link .arrow {
      color: var(--text-muted);
      font-size: 0.8rem;
    }
  </style>
</head>

<body>

  <!-- ШАПКА / NAVIGATION -->
  <header class="header">
    <div class="container header__container">
      <a href="index.html" class="logo">
        <span class="logo__icon">
          <img src="logo.svg" alt="Логотип">
        </span>
        <span class="logo__text">ЭкоГомель</span>
      </a>
      <nav class="nav">
        <a href="index.html" class="nav__link">Поиск</a>
        <a href="map.html" class="nav__link">Карта</a>
        <a href="about_project.html" class="nav__link">О проекте</a>
        <button id="theme-toggle" class="theme-toggle" aria-label="Переключить тему">
          <img src="moon.svg" alt="Луна">
        </button>
      </nav>
    </div>
  </header>

  <main class="container" style="padding-top: 30px; padding-bottom: 60px;">
    <div id="wasteContent">
      <!-- Динамическое содержимое (Каталог / Карточка отхода / Результаты поиска) -->
      <p class="card__count">Загрузка каталога...</p>
    </div>
  </main>

  <!-- ПОДВАЛ / FOOTER -->
  <footer class="footer">
    <div class="container footer__container">
      <div class="footer__brand">
        <h3>ЭкоГомель</h3>
        <p>Удобный и понятный гид по раздельному сбору мусора и утилизации сложных отходов в вашем городе. Помогаем делать мир чище, шаг за шагом.</p>
      </div>
      <div class="footer__bottom">
        <span>© 2026 ЭкоГомель. Все права защищены.</span>
        <span>Данные актуальны на 2026 год</span>
      </div>
    </div>
  </footer>

  <script src="api.js"></script>
  <script src="search.js"></script>
  <script src="theme.js"></script>
  
  <script>
    const contentContainer = document.getElementById('wasteContent');

    // Иконки для категорий по умолчанию (если категория совпадает по названию)
    const CATEGORY_ICONS = {
      'Пластик': 'plastic.svg',
      'Стекло': 'glass.svg',
      'Макулатура': 'paper.svg',
      'Металлолом': 'iron.svg',
      'Электроника': 'electric.svg',
      'Опасные отходы': 'battery.svg',
      'Батарейки': 'battery.svg',
      'Текстиль': 'paper.svg',
      'Бытовая химия': 'battery.svg'
    };

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    let cachedWasteItems = []; // Кэш данных для фильтрации
    let currentSearchQuery = '';
    let currentCategoryFilter = null;

    // Фильтрация кэша по поисковому запросу
    function filterItemsBySearch(items, query) {
      const normalized = String(query || '').trim().toLowerCase();
      if (!normalized) return items;

      return items.filter(item => {
        const nameMatch = item.name && item.name.toLowerCase().includes(normalized);
        const codeMatch = item.code && item.code.toLowerCase().includes(normalized);
        const categoryMatch = item.category && item.category.toLowerCase().includes(normalized);
        const keywordsMatch = Array.isArray(item.keywords) && item.keywords.some(k => k.toLowerCase().includes(normalized));
        return nameMatch || codeMatch || categoryMatch || keywordsMatch;
      });
    }

    // Состояние каталога в URL, чтобы фильтры переживали перезагрузку
    function syncCatalogUrl() {
      const params = new URLSearchParams();
      if (currentSearchQuery) params.set('search', currentSearchQuery);
      if (currentCategoryFilter) params.set('category', currentCategoryFilter);
      const queryString = params.toString();
      try {
        history.replaceState(null, '', queryString ? `waste.html?${queryString}` : 'waste.html');
      } catch (error) {
        // На file:// браузер может запрещать изменение URL — фильтры продолжат работать
      }
    }

    function renderCatalog() {
      const searchedItems = filterItemsBySearch(cachedWasteItems, currentSearchQuery);
      renderCategoriesCatalog(searchedItems, currentCategoryFilter, currentSearchQuery);
    }

    // ДИНАМИЧЕСКИЙ РЕНДЕР КАТЕГОРИЙ С ПОЛНОЙ ФИЛЬТРАЦИЕЙ
    function renderCategoriesCatalog(allWasteItems = [], activeCategoryFilter = null, searchQuery = '') {
      if (searchQuery) {
        document.title = `${searchQuery} — поиск — ЭкоГомель`;
      } else {
        document.title = activeCategoryFilter ? `${activeCategoryFilter} — ЭкоГомель` : 'Все категории — ЭкоГомель';
      }

      // 1. Собираем уникальные категории из базы
      const categoriesMap = {};
      
      allWasteItems.forEach(item => {
        const catName = item.category || 'Прочее';
        if (!categoriesMap[catName]) {
          categoriesMap[catName] = [];
        }
        categoriesMap[catName].push(item);
      });

      const categoryNames = Object.keys(categoriesMap);

      // Список категорий для чипов: активный фильтр должен оставаться видимым,
      // даже если поиск не нашёл в нём совпадений
      const quickCategoryNames = activeCategoryFilter && !categoryNames.includes(activeCategoryFilter)
        ? [...categoryNames, activeCategoryFilter]
        : categoryNames;

      // Кнопки-переключатели категорий
      const quickButtonsHtml = quickCategoryNames.map(catName => {
        const isActive = activeCategoryFilter === catName;
        return `<a href="#" class="quick-cat-btn ${isActive ? 'active' : ''}" data-category="${escapeHtml(catName)}" aria-pressed="${isActive}">${escapeHtml(catName)}</a>`;
      }).join('');

      // Если активен фильтр по категории, оставляем только её блок
      const displayedCategories = activeCategoryFilter
        ? categoryNames.filter(cat => cat === activeCategoryFilter)
        : categoryNames;

      // Генерируем карточки отфильтрованных категорий
      const categoryCardsHtml = displayedCategories.map(catName => {
        const items = categoriesMap[catName];
        const icon = CATEGORY_ICONS[catName] || 'plastic.svg';

        const itemsListHtml = items.map(item => `
          <li>
            <a href="waste.html?id=${item.id}" class="cat-item-link">
              <span>${escapeHtml(item.name)}</span>
              <span class="arrow">&gt;</span>
            </a>
          </li>
        `).join('');

        return `
          <div class="cat-block" id="cat-${catName}">
            <div class="cat-block__header">
              <div class="cat-block__icon-box">
                <img src="${icon}" alt="${catName}">
              </div>
              <div>
                <h3 class="cat-block__title">${catName}</h3>
                <span class="cat-block__desc">Всего позиций в базе: ${items.length}</span>
              </div>
            </div>
            <ul class="cat-items-list">
              ${itemsListHtml}
            </ul>
          </div>
        `;
      }).join('');

      const emptyMessage = searchQuery
        ? `Ничего не найдено по запросу «${escapeHtml(searchQuery)}».`
        : 'В данной категории нет позиций.';

      const pageTitle = searchQuery
        ? `Результаты поиска: «${escapeHtml(searchQuery)}»${activeCategoryFilter ? ` · ${escapeHtml(activeCategoryFilter)}` : ''}`
        : (activeCategoryFilter ? `Категория: ${escapeHtml(activeCategoryFilter)}` : 'Все категории');

      contentContainer.innerHTML = `
        <div class="breadcrumbs">
          <a href="index.html">Главная</a> &gt; <span>Все категории</span>
        </div>

        <h1 class="page-title">${pageTitle}</h1>
        <p class="page-subtitle">Найдите нужный предмет и узнайте, как подготовить его к сдаче и куда отнести в Гомеле.</p>

        <div class="catalog-search">
          <div class="catalog-search__input-wrapper">
            <img src="search.svg" alt="Поиск">
            <input type="text" id="catalogSearchInput" class="catalog-search__input" value="${escapeHtml(searchQuery)}" placeholder="Название предмета, например: батарейка или термометр">
          </div>
          <button id="catalogSearchBtn" class="btn btn--primary">Найти</button>
        </div>

        <div class="quick-categories" ${quickCategoryNames.length === 0 ? 'style="display:none;"' : ''}>
          <span class="quick-categories__label">Фильтр по категориям:</span>
          <div class="quick-categories__list">
            ${quickButtonsHtml}
          </div>
        </div>

        <div class="categories-section-header">
          <h2>${searchQuery ? 'Найденные отходы' : (activeCategoryFilter ? 'Выбранная категория' : 'Отходы по категориям')}</h2>
          <span>${searchQuery ? (activeCategoryFilter ? 'Показаны результаты поиска в выбранной категории' : 'Показаны все совпадения по запросу') : (activeCategoryFilter ? 'Показаны элементы выбранной категории' : 'Выберите предмет, чтобы узнать правила сдачи')}</span>
        </div>

        <div class="category-blocks-grid">
          ${categoryCardsHtml || `<p style="color:var(--text-muted);">${emptyMessage}</p>`}
        </div>
      `;

      // Настройка локального поиска и переключателей категорий
      const searchInput = document.getElementById('catalogSearchInput');
      const searchBtn = document.getElementById('catalogSearchBtn');
      const doSearch = () => {
        currentSearchQuery = searchInput.value.trim();
        currentCategoryFilter = null;
        syncCatalogUrl();
        renderCatalog();

        const nextInput = document.getElementById('catalogSearchInput');
        if (nextInput) {
          nextInput.focus();
          nextInput.setSelectionRange(nextInput.value.length, nextInput.value.length);
        }
      };
      if (searchBtn && searchInput) {
        searchBtn.addEventListener('click', doSearch);
        searchInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') doSearch(); });
      }

      const quickList = document.querySelector('.quick-categories__list');
      if (quickList) {
        quickList.addEventListener('click', (event) => {
          const button = event.target.closest('.quick-cat-btn');
          if (!button) return;
          event.preventDefault();
          filterByCategory(button.dataset.category);
        });
      }
    }

    // Переключатель категории: повторный клик снимает фильтр
    function filterByCategory(categoryName) {
      currentCategoryFilter = currentCategoryFilter === categoryName ? null : categoryName;
      syncCatalogUrl();
      renderCatalog();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Рендер детальной карточки конкретного отхода
    function renderWasteDetail(item, points) {
      document.title = `${item.name} — ЭкоГомель`;

      const badges = [
        item.recyclable !== false ? '<span class="badge badge--success">✔ перерабатывается</span>' : '<span class="badge badge--warning">✖ не перерабатывается</span>'
      ];
      if (item.hazard_class) badges.push(`<span class="badge badge--warning">${escapeHtml(item.hazard_class)}</span>`);

      const stepsHtml = (Array.isArray(item.preparation_steps) && item.preparation_steps.length > 0)
        ? item.preparation_steps.map((step, idx) => `<li><span class="step-num">${idx + 1}</span> ${escapeHtml(step)}</li>`).join('')
        : '<li>Инструкция по подготовке пока не добавлена.</li>';

      const pointsHtml = (points && points.length > 0)
        ? points.map(p => `
            <div class="point-card">
              <div class="point-card__header"><h5>${escapeHtml(p.name)}</h5></div>
              <p class="point-card__address">${escapeHtml(p.address)}</p>
              <div class="point-card__footer"><span>${escapeHtml(p.working_hours)}</span></div>
            </div>
          `).join('')
        : '<p class="card__count">Пункты приёма пока не указаны.</p>';

      contentContainer.innerHTML = `
        <div class="breadcrumbs">
          <a href="index.html">Главная</a> &gt; <a href="waste.html">Все категории</a> &gt; <span>${escapeHtml(item.name)}</span>
        </div>

        <section class="info-card" style="margin-top: 20px;">
          <div class="info-card__header">
            <h1 style="font-size: 1.8rem;">${escapeHtml(item.name)}</h1>
            <div class="badges">${badges.join('')}</div>
          </div>
          <p class="card__count">Категория: ${escapeHtml(item.category)}${item.code ? ` · Код: ${escapeHtml(item.code)}` : ''}</p>
        </section>

        <section class="info-card" style="margin-top: 20px;">
          <h3>Как подготовить к сдаче</h3>
          <ul class="steps-list">${stepsHtml}</ul>
        </section>

        <section class="info-card" style="margin-top: 20px;">
          <h3>Что происходит при переработке?</h3>
          <p class="info-card__desc">${escapeHtml(item.what_happens_next) || 'Информация пока не добавлена.'}</p>
        </section>

        <section class="info-card" style="margin-top: 20px;">
          <h3>Пункты приёма</h3>
          <div class="points-list">${pointsHtml}</div>
        </section>
      `;
    }

    // Главная инициализация страницы
    async function initWastePage() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      currentSearchQuery = (params.get('search') || '').trim();
      currentCategoryFilter = params.get('category') || null;

      try {
        cachedWasteItems = await EcoAPI.getWaste().catch(() => []);

        // 1. Если запрошен конкретный ID из базы
        if (id) {
          const item = cachedWasteItems.find(i => String(i.id) === String(id)) || await EcoAPI.getWasteItem(id).catch(() => null);
          if (item) {
            const points = await EcoAPI.getPoints({ waste_id: item.id }).catch(() => []);
            renderWasteDetail(item, points);
            return;
          }
        }

        // 2. Рендерим каталог с учётом search/category из URL
        renderCatalog();

      } catch (error) {
        console.error('Ошибка загрузки данных из БД:', error);
        renderCatalog();
      }
    }

    document.addEventListener('DOMContentLoaded', initWastePage);
  </script>
</body>

</html>
